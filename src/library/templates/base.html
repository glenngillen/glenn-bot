<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Knowledge Library{% endblock %} | Glenn Bot</title>
    <meta name="description" content="{% block description %}A browsable library of knowledge, insights, and resources.{% endblock %}">
    <link rel="stylesheet" href="/assets/css/styles.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <h1 class="site-title">
                <a href="/">Knowledge Library</a>
            </h1>
            <nav class="nav">
                <a href="/" class="nav-link{% if active_page == 'home' %} active{% endif %}">Home</a>
                <a href="/all/" class="nav-link{% if active_page == 'all' %} active{% endif %}">All Content</a>
            </nav>
            <form class="search-form" action="/search/" method="get">
                <input type="search" name="q" class="search-input" placeholder="Search library..." aria-label="Search library">
            </form>
        </div>
    </header>

    <main class="page-content">
        <div class="container">
            {% block breadcrumbs %}{% endblock %}
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Generated by Glenn Bot Knowledge Library</p>
        </div>
    </footer>

    <!-- Fuse.js for client-side fuzzy search -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <!-- Library search and pagination functionality -->
    <script src="/assets/js/search.js"></script>
    {% block scripts_extra %}{% endblock %}
</body>
</html>
