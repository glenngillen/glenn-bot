<svg xmlns="http://www.w3.org/2000/svg" width="200" height="267" viewBox="0 0 200 267">
  <defs>
    <linearGradient id="frameworkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="267" rx="8" fill="url(#frameworkGradient)"/>
  <!-- Flowchart/diagram icon -->
  <g transform="translate(40, 73.5)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top box -->
    <rect x="35" y="0" width="50" height="30" rx="4"/>
    <!-- Middle boxes -->
    <rect x="0" y="55" width="45" height="30" rx="4"/>
    <rect x="75" y="55" width="45" height="30" rx="4"/>
    <!-- Bottom box -->
    <rect x="35" y="110" width="50" height="30" rx="4"/>
    <!-- Connecting lines -->
    <line x1="60" y1="30" x2="60" y2="40"/>
    <line x1="60" y1="40" x2="22" y2="40"/>
    <line x1="22" y1="40" x2="22" y2="55"/>
    <line x1="60" y1="40" x2="97" y2="40"/>
    <line x1="97" y1="40" x2="97" y2="55"/>
    <line x1="22" y1="85" x2="22" y2="95"/>
    <line x1="97" y1="85" x2="97" y2="95"/>
    <line x1="22" y1="95" x2="60" y2="95"/>
    <line x1="97" y1="95" x2="60" y2="95"/>
    <line x1="60" y1="95" x2="60" y2="110"/>
  </g>
</svg>
