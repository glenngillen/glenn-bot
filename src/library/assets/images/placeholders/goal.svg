<svg xmlns="http://www.w3.org/2000/svg" width="200" height="267" viewBox="0 0 200 267">
  <defs>
    <linearGradient id="goalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="267" rx="8" fill="url(#goalGradient)"/>
  <!-- Target icon -->
  <g transform="translate(50, 83.5)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer circle -->
    <circle cx="50" cy="50" r="45"/>
    <!-- Middle circle -->
    <circle cx="50" cy="50" r="30"/>
    <!-- Inner circle -->
    <circle cx="50" cy="50" r="15"/>
    <!-- Bullseye -->
    <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
    <!-- Arrow -->
    <line x1="80" y1="20" x2="55" y2="45"/>
    <polyline points="80,20 80,35 65,20" fill="none"/>
  </g>
</svg>
