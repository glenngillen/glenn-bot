<svg xmlns="http://www.w3.org/2000/svg" width="200" height="267" viewBox="0 0 200 267">
  <defs>
    <linearGradient id="valueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="200" height="267" rx="8" fill="url(#valueGradient)"/>
  <!-- Compass icon -->
  <g transform="translate(50, 83.5)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer circle -->
    <circle cx="50" cy="50" r="45"/>
    <!-- Inner circle -->
    <circle cx="50" cy="50" r="8"/>
    <!-- Cardinal points -->
    <line x1="50" y1="5" x2="50" y2="20"/>
    <line x1="50" y1="80" x2="50" y2="95"/>
    <line x1="5" y1="50" x2="20" y2="50"/>
    <line x1="80" y1="50" x2="95" y2="50"/>
    <!-- Compass needle -->
    <polygon points="50,15 44,50 50,58 56,50" fill="#FFFFFF" stroke="none"/>
    <polygon points="50,85 44,50 50,42 56,50" fill="rgba(255,255,255,0.5)" stroke="none"/>
  </g>
</svg>
