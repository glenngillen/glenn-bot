<svg xmlns="http://www.w3.org/2000/svg" width="200" height="267" viewBox="0 0 200 267">
  <defs>
    <linearGradient id="preferenceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F87171"/>
      <stop offset="100%" style="stop-color:#EF4444"/>
    </linearGradient>
  </defs>
  <rect width="200" height="267" rx="8" fill="url(#preferenceGradient)"/>
  <!-- Settings/sliders icon -->
  <g transform="translate(45, 83.5)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- First slider track -->
    <line x1="0" y1="15" x2="110" y2="15"/>
    <!-- First slider knob -->
    <circle cx="35" cy="15" r="10" fill="#FFFFFF"/>
    <!-- Second slider track -->
    <line x1="0" y1="50" x2="110" y2="50"/>
    <!-- Second slider knob -->
    <circle cx="75" cy="50" r="10" fill="#FFFFFF"/>
    <!-- Third slider track -->
    <line x1="0" y1="85" x2="110" y2="85"/>
    <!-- Third slider knob -->
    <circle cx="50" cy="85" r="10" fill="#FFFFFF"/>
  </g>
</svg>
