<svg xmlns="http://www.w3.org/2000/svg" width="200" height="267" viewBox="0 0 200 267">
  <defs>
    <linearGradient id="webGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94A3B8"/>
      <stop offset="100%" style="stop-color:#64748B"/>
    </linearGradient>
  </defs>
  <rect width="200" height="267" rx="8" fill="url(#webGradient)"/>
  <!-- Globe icon -->
  <g transform="translate(50, 83.5)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer circle -->
    <circle cx="50" cy="50" r="45"/>
    <!-- Vertical ellipse (longitude) -->
    <ellipse cx="50" cy="50" rx="20" ry="45"/>
    <!-- Horizontal lines (latitude) -->
    <path d="M5 50 Q50 35, 95 50"/>
    <path d="M5 50 Q50 65, 95 50"/>
    <!-- Equator -->
    <line x1="5" y1="50" x2="95" y2="50"/>
    <!-- Top/bottom caps -->
    <path d="M20 20 Q50 30, 80 20"/>
    <path d="M20 80 Q50 70, 80 80"/>
  </g>
</svg>
