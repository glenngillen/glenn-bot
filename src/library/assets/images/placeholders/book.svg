<svg xmlns="http://www.w3.org/2000/svg" width="200" height="267" viewBox="0 0 200 267">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="267" rx="8" fill="url(#bookGradient)"/>
  <!-- Book icon -->
  <g transform="translate(50, 83.5)" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open book -->
    <path d="M5 10 C5 5, 10 0, 50 0 C90 0, 95 5, 95 10 L95 90 C95 85, 90 80, 50 80 C10 80, 5 85, 5 90 Z"/>
    <!-- Center spine -->
    <line x1="50" y1="0" x2="50" y2="80"/>
    <!-- Left page lines -->
    <line x1="15" y1="25" x2="40" y2="25"/>
    <line x1="15" y1="40" x2="40" y2="40"/>
    <line x1="15" y1="55" x2="40" y2="55"/>
    <!-- Right page lines -->
    <line x1="60" y1="25" x2="85" y2="25"/>
    <line x1="60" y1="40" x2="85" y2="40"/>
    <line x1="60" y1="55" x2="85" y2="55"/>
  </g>
</svg>
